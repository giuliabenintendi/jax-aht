ENV_NAME: card-game
ROLLOUT_LENGTH: 8   # = max_steps; one full episode per env per rollout
ENV_KWARGS:
  max_steps: 8
  obs_type: image
  shuffle: true
  # Other-Play off: omitting the two other_play flags makes op_active=False and the card
  # mechanism falls back to the env's shared card_permutation. This is a single-variable
  # change from card-game-op-delib-actions (OP removed, nothing else).
TASK_NAME: card-game-delib-noop
