# @package algorithm
ALG: gaze_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# Network
FC_HIDDEN_DIM: 256
LSTM_HIDDEN_DIM: 128
GAZE_HIDDEN_DIM: 64
GAZE_SPATIAL_BASIS_DEPTH: 8
GAZE_CONV_DIM: 16
CONTRASTIVE_DIM: 128
FEED_OTHER_ATTN: false
GAZE_TARGET_SIGMA_X: 0.20
GAZE_TARGET_SIGMA_Y: 0.20

# Multi-agent gaze reward
GAZE_BETA_MAX: 0.01
GAZE_WARMUP_ENV_STEPS: 200000

# ResNet encoder
CONV_FILTERS: 32
CONV_NUM_BLOCKS: 4
CONV_KERNEL_SIZE: 3
CONV_STRIDE: 2
CONV_PADDING: SAME

# Return-guided contrastive learning
CONTRASTIVE_BUFFER_CAPACITY: 8192
CONTRASTIVE_TOP_K: 16
CONTRASTIVE_NUM_ANCHORS: 128
CONTRASTIVE_MICROBATCH_SIZE: 32
CONTRASTIVE_RETURN_MARGIN: 0.0
CONTRASTIVE_TRIPLET_MARGIN: 0.2
CONTRASTIVE_WEIGHT: 0.1
SPREAD_WEIGHT: 0.01
CONTRASTIVE_RETURN_GAMMA: 1.0
