# @package algorithm
ALG: gaze_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# Network
FC_HIDDEN_DIM: 512
LSTM_HIDDEN_DIM: 256
GAZE_SPATIAL_BASIS_DEPTH: 64
MOTT_KEY_DIM: 8
MOTT_VALUE_DIM: 120
MOTT_NUM_QUERIES: 4
MOTT_QUERY_HIDDEN_DIM_1: 128
MOTT_QUERY_HIDDEN_DIM_2: 288
FEED_OTHER_ATTN: false

# Multi-agent gaze penalty disabled by default; keep JSD only as a diagnostic.
GAZE_BETA_MAX: 0.0
GAZE_WARMUP_ENV_STEPS: 200000

# ResNet encoder
CONV_FILTERS: 32
CONV_NUM_BLOCKS: 4
CONV_KERNEL_SIZE: 3
CONV_STRIDE: 2
CONV_PADDING: SAME
