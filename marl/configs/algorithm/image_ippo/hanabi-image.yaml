defaults:
  - image_ippo/_base_
  - _self_

# Hyperparameters from JaxMARL's official Hanabi IPPO baseline
# (baselines/IPPO/config/ippo_rnn_hanabi.yaml), with the project's existing
# network kept unchanged (FC_HIDDEN_DIM=256, LSTM_HIDDEN_DIM=128).
TOTAL_TIMESTEPS: 1e7        # paper uses 1e10; truncated for iteration
NUM_ENVS: 1024
NUM_SEEDS: 5                # for XP matrix comparison (5x5=25 cross-play scores)
LR: 5e-4                    # JaxMARL Hanabi
GAE_LAMBDA: 0.95            # JaxMARL Hanabi (was 0.8 in image_ippo base)
NUM_MINIBATCHES: 4          # JaxMARL Hanabi (was 16 in image_ippo base)
ENT_COEF: 0.01
