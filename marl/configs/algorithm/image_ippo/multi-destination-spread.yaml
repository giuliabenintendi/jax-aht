defaults:
  - image_ippo/_base_
  - _self_

# Multi-Destination Spread (4 agents) on the shared image_ippo trainer, keeping
# our ResNet+LSTM image network. Training scale matches the card-game recipe
# (1024 envs, 4 epochs, 16 minibatches); LR/gamma/lambda/clip/ent kept at paper
# Table C.1 values. NOTE: image_ippo has no reward normalization, whereas the
# card game ran on ja_ippo with NORMALIZE_REWARDS=true — likely the missing piece.
TOTAL_TIMESTEPS: 5e6   # peak coordination is reached by ~4M (see run 4gbczabm); 10M wasted the tail
NUM_ENVS: 512       # 512 * 100-step rollout -> ~97 updates at 5e6 (lighter memory than 1024)
NUM_SEEDS: 3        # base_config_marl forces 1; pass algorithm.NUM_SEEDS=3 on the CLI

LR: 5e-4            # paper Table C.1 (Adam eps=1e-5 set in make_optimizer); card game used 4e-4
GAMMA: 0.99         # paper Table C.1
GAE_LAMBDA: 0.95    # paper Table C.1; card game used 0.8
CLIP_EPS: 0.2       # paper Table C.1
ENT_COEF: 0.01      # paper Table C.1 / card game
VF_COEF: 0.5
UPDATE_EPOCHS: 4    # card-game recipe
NUM_MINIBATCHES: 16 # card-game recipe (4 agents x 512 envs x 100 / 16 = 12,800 per minibatch)
ANNEAL_LR: false
MAX_GRAD_NORM: 0.5

# Welford reward normalization (the card game's actual difference-maker; MDS's
# dense reward is large, so the critic was fighting the scale — value loss ~57-91).
NORMALIZE_REWARDS: true

# Per-checkpoint episode videos via the shared eval-media helper.
SAVE_CKPT_VIDEOS: true
