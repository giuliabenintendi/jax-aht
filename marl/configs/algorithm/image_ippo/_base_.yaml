# @package algorithm
# Image IPPO base config (no joint attention baseline)
# Same architecture and PPO hyperparameters as JA-IPPO minus attention.
ALG: image_ippo
NUM_CHECKPOINTS: 5
LIVE_WANDB_LOGGING: true    # push chunk-aggregated metrics to wandb every ckpt window
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO — aligned with Forkel et al. 2025 Overcooked baseline
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# Network
FC_HIDDEN_DIM: 256
LSTM_HIDDEN_DIM: 128

# ResNet CNN encoder (following Forkel et al. 2025)
CONV_FILTERS: 32
CONV_NUM_BLOCKS: 4
CONV_KERNEL_SIZE: 3
CONV_STRIDE: 2
CONV_PADDING: SAME
