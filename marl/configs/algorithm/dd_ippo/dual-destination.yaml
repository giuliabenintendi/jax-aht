defaults:
  - image_ippo/_base_
  - _self_

ALG: dd_ippo

# Training scale (DreamTeam Table 7, DD column)
TOTAL_TIMESTEPS: 1e7
NUM_ENVS: 512       # match DreamTeam's real-env parallelism (their SFL experts used 512 parallel envs)
NUM_SEEDS: 3        # DreamTeam used seeds 42,43,44; base_config_marl forces NUM_SEEDS=1, so pass algorithm.NUM_SEEDS=3 on the CLI

# PPO hyperparameters (DreamTeam Table 7) — override image_ippo/_base_
LR: 2e-4
GAMMA: 0.985
GAE_LAMBDA: 0.95
VF_COEF: 0.5
ENT_COEF: 0.001
UPDATE_EPOCHS: 6
NUM_MINIBATCHES: 8
ANNEAL_LR: false
CLIP_EPS: 0.2
MAX_GRAD_NORM: 0.5

# Network kept as ours (ResNet+LSTM) per "keep our network"; DreamTeam Table 6
# tuned blocks=1/kernel=5/filters=16/GRU-256 — not applied (GRU is a code change).

# DreamTeam-style checkpointing
CHECKPOINT_ROOT: checkpoints   # repo-root-relative; <root>/<run_name>/seed_{s}/params_{i}.pt
SAVE_CKPT_GIFS: true           # per-checkpoint ego-view agent0/agent1 gifs
