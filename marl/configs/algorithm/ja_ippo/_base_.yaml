# @package algorithm
# JA-IPPO base config (Lee et al. 2021)
# Network and JA hyperparameters match Appendix A of the paper.
# PPO hyperparameters match the reference code defaults.
ALG: ja_ippo
NUM_CHECKPOINTS: 5
CHECKPOINT_FREQ_TIMESTEPS: 200000  # save a checkpoint every N env steps (overrides NUM_CHECKPOINTS); set 0 to fall back to NUM_CHECKPOINTS evenly spaced
USE_BEST_CKPT_FOR_EVAL: true   # at end of training, run greedy/video/XP eval on per-seed best checkpoint instead of final params
SAVE_CHECKPOINT_FOLDER: true   # write each checkpoint as its own orbax sub-dir under <CHECKPOINT_ROOT>/<run_name>/ (plus chunk_scores.json)
CHECKPOINT_ROOT: "checkpoints" # repo-root-relative path (or absolute) where checkpoint folders are stored, separate from hydra output dir
LIVE_WANDB_LOGGING: true       # push aggregated metrics to wandb after each training chunk (same cadence as checkpoint saves) for live monitoring

# Eval-video volume controls (videos are slow + heavy on disk/wandb).
# With NUM_SEEDS=N the previous defaults rendered ~N SP videos + N*C(N,2) XP videos (XP was duplicated per seed).
EVAL_VIDEO_NUM_SEEDS: 1        # render per-seed videos for first N seeds only (0 disables per-seed videos entirely)
EVAL_VIDEO_LOG_XP: false       # render cross-play seed_i x seed_j videos (off by default; expensive)
EVAL_VIDEO_NUM_EPISODES: 10    # episodes per per-seed (SP) eval video
EVAL_VIDEO_XP_NUM_EPISODES: 3  # episodes per cross-play pair video
XP_VIDEO_MAX_PAIRS: 3          # cap on number of XP-pair videos when EVAL_VIDEO_LOG_XP is on (set to N*(N-1)/2 for full upper triangle)
ANNEAL_LR: False
MAX_GRAD_NORM: 0.5
NORMALIZE_REWARDS: true

# PPO — aligned with Forkel et al. 2025 Overcooked baseline
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01
POLICY_LOSS_TYPE: ppo  # "ppo" or "spo"

# JA network (paper Appendix A)
ACTIVATION: relu
JA_CONV_FILTERS: 64           # symbolic JA only
JA_NUM_HEADS: 4
JA_HEAD_FEATURES: 16
JA_SPATIAL_BASIS_DEPTH: 8
JA_SCALAR_EMBED_DIM: 5        # symbolic JA only
FC_HIDDEN_DIM: 256
LSTM_HIDDEN_DIM: 128

# ResNet CNN encoder (image JA only, following Forkel et al. 2025)
CONV_FILTERS: 32
CONV_NUM_BLOCKS: 4
CONV_KERNEL_SIZE: 3
CONV_STRIDE: 2
CONV_PADDING: SAME

# JA intrinsic reward (paper Appendix A)
JA_BETA_MAX: 0.0           # raw spatial JSD reward (Lee et al.); meaningless under OP — leave 0 for card-game
JA_WARMUP_ENV_STEPS: 3500000
FEED_OTHER_ATTN: false          # feed other agent's previous attention map as 4th image channel
QUERY_PARTNER_LSTM: false       # feed partner's actor LSTM h into spatial attention query
JA_CARD_ATTN: false             # OP-corrected card-level joint attention
JA_CARD_PARTNER_FEED: true      # append partner's translated card-attention as 5-dim scalar input (only used when JA_CARD_ATTN); set false to study JSD reward alone, without the input leak
JA_CARD_JSD_COEF: 0.0           # mass-gated card-level JSD alignment reward
JA_PARTNER_FEED_PER_HEAD: false  # if True, partner card attention is fed per-head (NUM_HEADS * 5 features) instead of head-averaged 5

# Three-part JA attention shaping (parallel to comm shaping)
JA_ATTN_MATCH_COEF: 0.0         # per-step card-attention agreement during deliberation: coef * (1 - JSD(q_0, q_1)/log 2) on OP-corrected 5-way card attention
JA_ATTN_SELF_COEF: 0.0          # per-agent at decision: coef if pick == own attention argmax (canonical-frame compare)
JA_AUX_PARTNER_ARGMAX_COEF: 0.0  # aux NLL on attention pool: force attention to peak at partner argmax view-slot
JA_GAZE_PICK_COEF: 0.0          # per-agent at decision: reward mass that the partner assigned on the previous step to the picked canonical card
