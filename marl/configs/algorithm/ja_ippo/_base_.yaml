# @package algorithm
# JA-IPPO base config (Lee et al. 2021)
# Network and JA hyperparameters match Appendix A of the paper.
# PPO hyperparameters match the reference code defaults.
ALG: ja_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO — tuned for Overcooked (JaxMARL CNN baseline)
LR: 5e-4
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# JA network (paper Appendix A)
ACTIVATION: relu
JA_CONV_FILTERS: 64
JA_NUM_HEADS: 4
JA_HEAD_FEATURES: 16
JA_SPATIAL_BASIS_DEPTH: 8
JA_SCALAR_EMBED_DIM: 5
FC_HIDDEN_DIM: 64
LSTM_HIDDEN_DIM: 64

# JA intrinsic reward (paper Appendix A)
JA_BETA_MAX: 0.01              # paper: 1e-2 (searched [1e-4, 1e-1])
JA_WARMUP_ENV_STEPS: 1000000   # paper: 200K, slower ramp to avoid beta saturating too early
NORMALIZE_REWARDS: true         # per-batch reward normalization before GAE
