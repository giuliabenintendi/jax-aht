# @package algorithm
# JA-IPPO base config (Lee et al. 2021)
# Network and JA hyperparameters match Appendix A of the paper.
# PPO hyperparameters match the reference code defaults.
ALG: ja_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO — aligned with Forkel et al. 2025 Overcooked baseline
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# JA network (paper Appendix A)
ACTIVATION: relu
JA_CONV_FILTERS: 64
JA_NUM_HEADS: 4
JA_HEAD_FEATURES: 16
JA_SPATIAL_BASIS_DEPTH: 8
JA_SCALAR_EMBED_DIM: 5
FC_HIDDEN_DIM: 64
LSTM_HIDDEN_DIM: 64

# JA intrinsic reward (paper Appendix A)
JA_BETA_MAX: 10.0
JA_WARMUP_ENV_STEPS: 200000    # paper: 200K
NORMALIZE_REWARDS: true         # streaming reward normalization (reference code default)
