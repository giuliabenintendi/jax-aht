# @package algorithm
# JA-IPPO base config (Lee et al. 2021)
# Network and JA hyperparameters match Appendix A of the paper.
# PPO hyperparameters match the reference code defaults.
ALG: ja_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 1.0

# PPO — paper Appendix A where specified, reference code defaults otherwise
LR: 1e-4                       # paper: "Adam with learning rate 10^{-4}"
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 0.5
UPDATE_EPOCHS: 25               # reference code: num_epochs=25
NUM_MINIBATCHES: 1              # reference code: no minibatching
CLIP_EPS: 0.2                   # reference code: importance_ratio_clipping=0.2
ENT_COEF: 0.0                   # reference code: entropy_regularization=0.0

# JA network (paper Appendix A)
ACTIVATION: relu
JA_CONV_FILTERS: 64
JA_NUM_HEADS: 4
JA_HEAD_FEATURES: 16
JA_SPATIAL_BASIS_DEPTH: 8
JA_SCALAR_EMBED_DIM: 5
FC_HIDDEN_DIM: 64
LSTM_HIDDEN_DIM: 64

# JA intrinsic reward (paper Appendix A)
JA_BETA_MAX: 0.01              # paper: 1e-2 (searched [1e-4, 1e-1])
JA_WARMUP_ENV_STEPS: 200000    # paper: "over the first 200000 steps"
