# @package algorithm
# JA-IPPO base config (Lee et al. 2021)
# Network and JA hyperparameters match Appendix A of the paper.
# PPO hyperparameters match the reference code defaults.
ALG: ja_ippo
NUM_CHECKPOINTS: 5
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5

# PPO — aligned with Forkel et al. 2025 Overcooked baseline
LR: 4e-4
GAMMA: 0.99
GAE_LAMBDA: 0.8
VF_COEF: 0.5
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 16
CLIP_EPS: 0.2
ENT_COEF: 0.01

# JA network (paper Appendix A)
ACTIVATION: relu
JA_CONV_FILTERS: 64           # symbolic JA only
JA_NUM_HEADS: 4
JA_HEAD_FEATURES: 16
JA_SPATIAL_BASIS_DEPTH: 8
JA_SCALAR_EMBED_DIM: 5        # symbolic JA only
FC_HIDDEN_DIM: 256
LSTM_HIDDEN_DIM: 128

# ResNet CNN encoder (image JA only, following Forkel et al. 2025)
CONV_FILTERS: 32
CONV_NUM_BLOCKS: 4
CONV_KERNEL_SIZE: 3
CONV_STRIDE: 2
CONV_PADDING: SAME

# JA intrinsic reward (paper Appendix A)
JA_BETA_MAX: 0.05
JA_WARMUP_ENV_STEPS: 3500000
USE_DUAL_CRITIC: false          # dual critic (V_ext + V_int) for separate reward baselines
DUAL_CRITIC_ACTOR_JA: false     # include JA advantage in policy gradient (requires USE_DUAL_CRITIC)
FEED_OTHER_ATTN: false          # feed other agent's previous attention map as 4th image channel
CROSS_AGENT_ATTN: false         # inter-agent cross-attention on learned embeddings
FILTER_ATTN_TOP1: false         # keep only global argmax of attention map
QUERY_PARTNER_LSTM: false       # feed partner's actor LSTM h into spatial attention query
ATTN_MSG_REWARD_COEF: 0.0      # attention-message consistency reward coefficient
