defaults:
  - ja_ippo/_base_
  - _self_

TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 1024
NUM_SEEDS: 5
# Render SP eval video for every seed (clamped to NUM_SEEDS in the loop).
EVAL_VIDEO_NUM_SEEDS: 100
LR: 5e-4
ANNEAL_LR: false
GAE_LAMBDA: 0.95
ENT_COEF: 0.01
FEED_OTHER_ATTN: false
COMMUNICATION: true
COMM_WARMUP_ENV_STEPS: 0
COMM_REWARD_START_SCALE: 0.0
# Compute card-level JSD as a diagnostic metric without using it as reward
# or partner-feed input. JA_CARD_ATTN remains false (no shaping reward).
JA_CARD_METRIC: true
