defaults:
  - ja_ippo/_base_
  - _self_

# IPPO / OP / HE IPPO baseline for the Card Alignment Game: identical PPO settings
# to card-game-mate, with joint attention entirely off. The IPPO and OP bars differ
# only in the task; for HE IPPO, override ENT_COEF on the command line.
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 1024
NUM_SEEDS: 48
LR: 5e-4
ANNEAL_LR: false
GAE_LAMBDA: 0.95
ENT_COEF: 0.01

FEED_OTHER_ATTN: false
JA_CARD_ATTN: false
JA_CARD_METRIC: false
JA_CARD_PARTNER_FEED: false
JA_ATTN_SELF_COEF: 0.0
JA_GAZE_PICK_COEF: 0.0
JA_AUX_PARTNER_ARGMAX_COEF: 0.0
