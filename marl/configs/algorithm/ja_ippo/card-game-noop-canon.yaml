defaults:
  - ja_ippo/_base_
  - _self_

# Naked No-OP self-play control. Matches the OP-delib conditions
# (card-game-op-delib-actions) training config EXACTLY -- LR, ANNEAL_LR, GAE_LAMBDA,
# ENT_COEF, TOTAL_TIMESTEPS, NUM_ENVS, and the _base_ minibatch/epoch defaults --
# so the only differences from the other figure bars are: OP off (via the
# card-game-delib-noop task) and joint attention OFF (plain IPPO).
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 1024
LR: 5e-4
ANNEAL_LR: false
GAE_LAMBDA: 0.95
ENT_COEF: 0.01

COMMUNICATION: false
FEED_OTHER_ATTN: false
JA_CARD_ATTN: false
JA_CARD_METRIC: false
JA_CARD_PARTNER_FEED: false
JA_ATTN_SELF_COEF: 0.0
JA_ATTN_MATCH_COEF: 0.0
JA_GAZE_PICK_COEF: 0.0
JA_AUX_PARTNER_ARGMAX_COEF: 0.0
