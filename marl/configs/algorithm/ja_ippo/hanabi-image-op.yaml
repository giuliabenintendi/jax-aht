defaults:
  - ja_ippo/_base_
  - _self_

# Other-Play baseline for Hanabi image obs under JA-IPPO (architecture-only,
# no JA shaping). With all JA_*_COEF still zero, this is the OP baseline
# that the OP+JA-shaping condition needs to beat in XP. To enable JA
# shaping, override JA_*_COEF on the command line or create a third config.
TOTAL_TIMESTEPS: 1e6        # dev default; bump for real runs
NUM_ENVS: 256               # dev default; bump to 1024 for real runs (memory-bound)
NUM_SEEDS: 1                # dev default; bump to 5+ for XP comparison
LR: 5e-4
GAE_LAMBDA: 0.95
NUM_MINIBATCHES: 4
ENT_COEF: 0.01

# Hanabi doesn't use card-game's communication channel
FEED_OTHER_ATTN: false
COMMUNICATION: false
COMM_WARMUP_ENV_STEPS: 0
COMM_REWARD_START_SCALE: 0.0
