defaults:
  - ja_ippo/_base_
  - _self_

# LBF hyperparameters matched to the future-occupancy / object-attention configs.
TOTAL_TIMESTEPS: 3e6
NUM_ENVS: 128
NUM_MINIBATCHES: 32
ANNEAL_LR: true
NORMALIZE_REWARDS: false

# Dense attended-object occupancy: select the partner-attended apple, build a
# discounted future-occupancy blob at it, and train the full spatial attention
# map with the same dense cross-entropy as future-occupancy. Attention-only (no
# partner actions/positions). Same partner-attention image feed.
JA_MECHANISM: future_occupancy
JA_LBF_DENSE_OBJECT_OCCUPANCY: true
FEED_OTHER_ATTN: true
SAVE_CKPT_VIDEOS: true

JA_OBJECT_AUX_COEF: 0.005
JA_FUTURE_GAMMA_OCC: 0.95
JA_OBJECT_ROI_RADIUS: 1

# Aux only, no overlap reward shaping.
JA_FUTURE_PARTNER_COEF: 0.0
JA_FUTURE_SELF_COEF: 0.0
