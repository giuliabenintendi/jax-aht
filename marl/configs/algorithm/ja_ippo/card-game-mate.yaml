defaults:
  - ja_ippo/_base_
  - _self_

# MATE on the Card Alignment Game. Pair with task=card-game-op-delib-actions.
# Deliberation actions every step, env reward only on the final step; the deliberation
# reward is gaze-pick only, plus the partner-argmax-occupancy aux loss (lambda_MATE).
# The MATE discount eta is JA_FUTURE_GAMMA_OCC, left at the card mechanism default of 0.9.
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 1024
NUM_SEEDS: 48
EVAL_VIDEO_NUM_SEEDS: 0
LR: 5e-4
ANNEAL_LR: false
GAE_LAMBDA: 0.95
ENT_COEF: 0.01

JA_CARD_ATTN: true
JA_CARD_PARTNER_FEED: true
JA_CARD_METRIC: true
JA_CARD_JSD_COEF: 0.0

JA_ATTN_SELF_COEF: 0.0
JA_GAZE_PICK_COEF: 0.1
JA_AUX_PARTNER_ARGMAX_COEF: 0.25
JA_AUX_PARTNER_PICK: true
