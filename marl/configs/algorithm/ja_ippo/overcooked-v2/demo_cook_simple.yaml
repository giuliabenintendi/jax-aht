defaults:
  - ja_ippo/_base_
  - _self_

# IPPO + attention (JSDMechanism). JA_BETA_MAX=0 (from _base_) => attention
# actor-critic trained with plain PPO; set >0 to activate the Lee et al. JSD
# intrinsic reward.
TOTAL_TIMESTEPS: 3e7   # paper Demo Cook SP uses 30M
NUM_ENVS: 256          # 256x400 OOMs, but 256x256 fits after the shorter rollout shrinks the buffer
CHECKPOINT_FREQ_TIMESTEPS: 1000000   # 30 checkpoints over the run
SAVE_CKPT_VIDEOS: true               # render capped checkpoint gameplay videos; all checkpoints still saved

# LR 4e-4 cooks well (~3.4 soups) but all three prior runs collapsed ~6-8M and
# LR annealing alone didn't tame it. Keep the cooking LR, add the stabilizers we
# were most aggressive on vs the paper/DreamTeam: GAE 0.9 (was 0.8) and a tighter
# grad clip 0.25 (was _base_'s 0.5; both references clip ~2x tighter).
LR: 4e-4
GAE_LAMBDA: 0.9
ANNEAL_LR: true
MAX_GRAD_NORM: 0.25
REW_SHAPING_HORIZON: 15000000   # linear shaped-reward anneal 1->0 over 15M env steps
