defaults:
  - ja_ippo/_base_
  - _self_

# MATE on OvercookedV2 Demo Cook Simple. Pair with task=overcooked-v2/demo_cook_simple-op-ego.
# These are the values logged by the 12 seeds behind the reported result; the egocentric
# crop and the ingredient-permutation Other-Play come from the task config.
TOTAL_TIMESTEPS: 3e7
NUM_ENVS: 192
NUM_SEEDS: 12
NUM_MINIBATCHES: 16
LR: 4e-4
ANNEAL_LR: true
GAE_LAMBDA: 0.8
ENT_COEF: 0.02
MAX_GRAD_NORM: 0.5

# Shaped-reward weight, annealed linearly to 0 across this many env steps.
# Set far beyond TOTAL_TIMESTEPS so the weight stays constant at ~1.0:
# annealing the shaping away costs both SP and XP here.
REW_SHAPING_HORIZON: 1000000000000

CHECKPOINT_FREQ_TIMESTEPS: 1000000
SAVE_CKPT_VIDEOS: true
CKPT_VIDEO_EVERY: 5

# Pool spatial attention onto the detected kitchen objects, select the
# partner-attended object, build an eta-discounted future-occupancy blob at it, and
# train the full attention map against it with cross-entropy. Partner attention is
# fed back as a 4th image channel.
JA_OBJECT_OCCUPANCY: true
FEED_OTHER_ATTN: true
# Partner attention is shared only inside the receiver's visible region, so the feed
# cannot leak the recipe the informed agent privately observes. The aux target uses
# the same gate.
JA_VISIBILITY_GATING: true

JA_OBJECT_AUX_COEF: 1e-4    # lambda_MATE
JA_FUTURE_GAMMA_OCC: 0.95   # eta
