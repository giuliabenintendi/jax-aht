defaults:
  - ja_ippo/_base_
  - _self_

# MATE + whole-map feed. With full-map, zero-masked observations, when the
# partner is visible the receiver gets the partner's entire allocentric
# attention map as the 4th channel; when the partner is not visible, the feed is
# zero. JA_FEED_BORDER_PROJECT is retained only for legacy egocentric configs.
#
# Unlike demo_cook_simple-mate (whose yaml recipe is stale), this file bakes the
# ACTUAL e02 recipe from the matelam1e4_e02 launch overrides, so runs need only
# task/algorithm/TRAIN_SEED/label on the CLI (run names must stay short: the
# logger dies past the filename length limit).
TOTAL_TIMESTEPS: 3e7
# Full-map allocentric obs is 40x88 (~2.2x the egocentric 40x40 pixels), so the
# per-batch activation footprint blows past a 32GB V100 at 192 envs (OOM ~25GB).
# 64 keeps mb16 and fits with headroom for the ckpt-video render spike.
NUM_ENVS: 64
CHECKPOINT_FREQ_TIMESTEPS: 1000000
SAVE_CKPT_VIDEOS: true
CKPT_VIDEO_EVERY: 5
CKPT_VIDEO_ATTENTION: true

LR: 4e-4
NUM_MINIBATCHES: 16
GAE_LAMBDA: 0.8
ANNEAL_LR: true
MAX_GRAD_NORM: 0.5
ENT_COEF: 0.02
REW_SHAPING_HORIZON: 1000000000000

JA_OBJECT_OCCUPANCY: true
FEED_OTHER_ATTN: true
JA_VISIBILITY_GATING: true
# No-op under full-map allocentric obs (feed/aux already share the RGB frame);
# only affects legacy egocentric-crop configs. Kept explicit to document intent.
JA_FEED_BORDER_PROJECT: false
JA_OBJECT_AUX_COEF: 1e-4
JA_FUTURE_GAMMA_OCC: 0.8
JA_FUTURE_PARTNER_COEF: 0.0
JA_FUTURE_SELF_COEF: 0.0
