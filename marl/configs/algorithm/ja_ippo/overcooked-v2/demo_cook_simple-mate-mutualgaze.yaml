defaults:
  - ja_ippo/_base_
  - _self_

# MATE (headline 12-seed recipe, SP 143 / XP 128) PLUS the 2-way mutual-gaze aux
# term: each agent's occupancy target gains the OTHER agent's body (its tile) as a
# shared attended-object, gated on that partner holding an item (holding coincides
# with being near the pot, where the FOVs overlap and the partner is visible, so
# the target stays a mutually-visible shared referent). Symmetric (both watch each
# other), consistent with MATE being mutual attention. Bakes in the headline CLI
# overrides (LR 4e-4, mb16, GAE 0.8, grad 0.5, 192 envs, constant shaping,
# ENT 0.02) so the launch command stays short -- otherwise the run name exceeds the
# 250-char wandb limit. Aux coefficient stays at the headline 1e-4, so the ONLY
# difference from the 143/128 baseline is the mutual-gaze term (clean single
# variable); everything else matches the headline exactly.
TOTAL_TIMESTEPS: 3e7
NUM_ENVS: 192
CHECKPOINT_FREQ_TIMESTEPS: 1000000
SAVE_CKPT_VIDEOS: true
CKPT_VIDEO_EVERY: 5
CKPT_VIDEO_ATTENTION: true

LR: 4e-4
NUM_MINIBATCHES: 16
GAE_LAMBDA: 0.8
ANNEAL_LR: true
MAX_GRAD_NORM: 0.5
ENT_COEF: 0.02
REW_SHAPING_HORIZON: 1000000000000   # constant shaping (headline), NOT the anneal

JA_OBJECT_OCCUPANCY: true
FEED_OTHER_ATTN: true
JA_VISIBILITY_GATING: true
JA_OBJECT_AUX_COEF: 1e-4             # headline coefficient; only the mutual-gaze term differs from 143/128
JA_FUTURE_GAMMA_OCC: 0.8
JA_FUTURE_PARTNER_COEF: 0.0
JA_FUTURE_SELF_COEF: 0.0

# The additions under test: the partner agent's body becomes a shared attended
# object in the receiver's occupancy target (holds+visible gated), 2-way symmetric.
JA_ATTEND_PARTNER_AGENT: true
JA_ATTEND_PARTNER_DIRECTIONAL: false
