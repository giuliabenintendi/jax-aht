defaults:
  - ja_ippo/_base_
  - _self_

# Non-JA PPO hyperparameters matched to the highest-scoring LBF baseline
# (W&B run f321gywc, ja_ippo_lbf, XP/sp_score 0.451). NUM_ENVS is 128 rather than
# that baseline's 256: the unified future-occupancy trainer cannot hold a 256-env
# batch on a 32GB GPU, so the LBF baseline is re-run at 128 on this trainer (JA off)
# for an apples-to-apples comparison. Inlined rather than inheriting the sibling
# lbf config, which Hydra resolves to a doubled ja_ippo/ja_ippo/_base_ path.
TOTAL_TIMESTEPS: 3e6
NUM_ENVS: 128
NUM_MINIBATCHES: 32
ANNEAL_LR: true
NORMALIZE_REWARDS: false  # baseline trained on raw env rewards; revisit when reward shaping is enabled

# Generalizable Joint Attention: entity-free future-occupancy shaping.
JA_MECHANISM: future_occupancy
FEED_OTHER_ATTN: true

# Per-checkpoint training videos.
SAVE_CKPT_VIDEOS: true

# First pass: no reward shaping. Test partner-attention feed + aux only.
JA_FUTURE_PARTNER_COEF: 0.0
JA_FUTURE_SELF_COEF: 0.0
JA_FUTURE_GAMMA_OCC: 0.95
JA_FUTURE_WARMUP_ENV_STEPS: 500000
JA_FUTURE_RAMP_ENV_STEPS: 500000

# Main supervised JA signal.
JA_FUTURE_AUX_PARTNER_OCC_COEF: 0.05
